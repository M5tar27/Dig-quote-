name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests (pricing engine)
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Intentionally no Supabase/Stripe/OpenAI secrets here. The app is built to
          # degrade gracefully without them (see lib/config.ts + app/error.tsx) so CI can
          # verify the build and lint pass on every PR without needing real credentials
          # wired into GitHub. Deploys (Vercel) use the real env vars — see README.md.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
